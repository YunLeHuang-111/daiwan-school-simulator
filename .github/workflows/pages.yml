name: Publish game to GitHub Pages
on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "data/**"
      - "scripts/build_share.py"
      - "tests/share_package.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build browser-only game
        run: python3 scripts/build_share.py
      - name: Check static package
        run: python3 tests/share_package.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
